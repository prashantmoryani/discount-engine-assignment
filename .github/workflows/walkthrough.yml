name: Verify and record live checkout
on: workflow_dispatch
permissions:
  contents: read
jobs:
  walkthrough:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: node scripts/walkthrough.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: live-checkout
          path: walkthrough-output/live-checkout.mp4
