name: Verify and record live checkout
on: workflow_dispatch
permissions:
  contents: read
jobs:
  walkthrough:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub's Ubuntu image includes Google Chrome. Only the recorder is needed.
      - run: npx playwright install ffmpeg
      - name: Provide the video encoder
        run: |
          npm install --prefix "$RUNNER_TEMP/encoder" @ffmpeg-installer/linux-x64@4.1.0
          echo "$RUNNER_TEMP/encoder/node_modules/@ffmpeg-installer/linux-x64" >> "$GITHUB_PATH"
      - run: node scripts/walkthrough.mjs
        env:
          CHROME_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        with:
          name: live-checkout
          path: walkthrough-output/live-checkout.mp4
